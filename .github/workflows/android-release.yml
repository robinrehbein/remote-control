name: Android Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.3.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Point tag at the built commit
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag -f "${{ inputs.tag }}"
          git push -f origin "refs/tags/${{ inputs.tag }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Unit tests
        run: gradle :app:testReleaseUnitTest --stacktrace --no-daemon

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: cp app/build/outputs/apk/release/app-release.apk "pocketagent-${RELEASE_TAG}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: android/pocketagent-*.apk
          generate_release_notes: true
