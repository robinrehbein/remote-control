name: Build & Push Images

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "shims/**"
      - "packages/protocol/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: orchestrator, dockerfile: server/Dockerfile, image: orchestrator }
          - { name: kilo-shim, dockerfile: shims/kilo/Dockerfile, image: kilo-shim }
          - { name: claude-shim, dockerfile: shims/claude/Dockerfile, image: claude-shim }
          - { name: pi-shim, dockerfile: shims/pi/Dockerfile, image: pi-shim }
          - { name: junie-shim, dockerfile: shims/junie/Dockerfile, image: junie-shim }
          - { name: codex-shim, dockerfile: shims/codex/Dockerfile, image: codex-shim }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
