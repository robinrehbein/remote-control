name: Build & Push Images

# In v1 baute dieser Workflow das Orchestrator-Image und fünf Adapter-Shims.
# In v2 gibt es nur noch zwei Images, und eines davon muss hier gar nicht
# entstehen: `pocketagent/pi-runner` baut der Orchestrator beim ersten
# Session-Start selbst über die Docker-API, aus dem Build-Kontext, den sein
# eigenes Image unter /app/build-context mitbringt (server/src/docker.ts,
# ensureRunnerImage). Ein Registry-Push des Runners ist also nirgends
# Voraussetzung — er ist nur die Abkürzung für Betreiber, die das Artefakt
# selbst besitzen und den Server per RUNNER_IMAGE darauf zeigen lassen wollen
# (dann wird nur gepullt, nie gebaut).
#
# Beide Images werden aus dem Repo-ROOT gebaut; die Kontexte teilen sich
# tsconfig.base.json und packages/protocol.
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "runner/**"
      - "packages/protocol/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: orchestrator, dockerfile: server/Dockerfile, image: orchestrator }
          - { name: pi-runner, dockerfile: runner/Dockerfile, image: pi-runner }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
