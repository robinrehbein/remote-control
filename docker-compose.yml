# PocketAgent v2 (pi-only). Ein Dienst: der Orchestrator.
#
# Das Runner-Image ist hier bewusst KEIN Pflicht-Service — der Orchestrator
# baut `pocketagent/pi-runner:<RUNNER_IMAGE_TAG>` beim ersten Session-Start
# selbst über die Docker-API (server/src/docker.ts, ensureRunnerImage), aus dem
# Build-Kontext, den sein eigenes Image unter /app/build-context mitbringt. Wer
# ihn lieber vorbaut (der erste Start dauert sonst einige Minuten), nimmt das
# optionale Profil unten.
services:
  orchestrator:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        # Hochzählen, wenn sich runner/ geändert hat: ensureRunnerImage findet
        # dann kein Image dieses Namens und baut neu. Das ist die ganze
        # Invalidierung, die v2 hat (Content-Hash-Tags gibt es nicht mehr).
        RUNNER_IMAGE_TAG: ${RUNNER_IMAGE_TAG:-latest}
    image: pocketagent/orchestrator:latest
    container_name: pocketagent-orchestrator
    restart: unless-stopped
    # Hinter Reverse-Proxy betreiben (Coolify/Traefik mit TLS); nur zum lokalen
    # Testen direkt erreichbar. Wer Coolify die Domain routen lässt, kann das
    # ports-Mapping ganz entfernen.
    ports:
      # Loopback-only by default; remove the 127.0.0.1 prefix only for
      # direct LAN exposure or when a reverse proxy terminates TLS for you.
      - "127.0.0.1:3000:3000"
      # ---- Egress-Proxy für Fly-Machines (optional, KEIN Default) --------
      # Fly-Machines mit Policy 'allowlist' erreichen den Egress-Proxy über
      # seine öffentliche URL (EGRESS_PUBLIC_URL in .env, siehe
      # sessions.buildFlyMachineEnv); dafür muss EGRESS_PROXY_PORT (3128)
      # von außen erreichbar sein. Auth läuft dort ausschließlich über das
      # Token-Gate (Proxy-Authorization mit dem Shim-Token der Session) —
      # das Peer-IP-Gate kennt keine Fly-Adressen. Betriebsempfehlung: TLS
      # per TCP-Passthrough, z. B. Traefik TCP-Router auf diesen Port
      # (services.tcp.routers.… rule: HostSNI(`egress.example.com`) mit
      # tls=true und den Service auf server:3128 zeigen lassen). Kein
      # HTTP-terminierender Proxy davor — der bricht das Peer-IP-Gate der
      # Docker-Sessions; Details im Kopfkommentar von server/src/egress-proxy.ts.
      # - "3128:3128"
    environment:
      # Generate once: openssl rand -hex 32
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY in .env}
      DATA_DIR: /data
      NETWORK_NAME: pocketagent
      SESSION_MEM_LIMIT: ${SESSION_MEM_LIMIT:-2g}
      IDLE_STOP_SEC: ${IDLE_STOP_SEC:-900}
      GC_DAYS: ${GC_DAYS:-14}
      # Hinter Coolify/Traefik auf 1 setzen (.env): req.ip löst dann den
      # echten Client aus X-Forwarded-For auf — sonst teilen sich alle Geräte
      # die Proxy-Adresse und das WS-Verbindungslimit (10/IP) trifft Unbeteiligte.
      TRUST_PROXY: ${TRUST_PROXY:-}
      # ---- Das eine Runner-Image -----------------------------------------
      # Namensraum und Tag des selbst gebauten Images.
      RUNNER_IMAGE_PREFIX: ${RUNNER_IMAGE_PREFIX:-pocketagent}
      RUNNER_IMAGE_TAG: ${RUNNER_IMAGE_TAG:-latest}
      # Vollständig vorgegebenes Registry-Image (z. B.
      # ghcr.io/acme/pi-runner:2026-08). GESETZT heißt: nur pullen, nie bauen —
      # der Betreiber besitzt das Artefakt. Leer lassen für den Selbstbau.
      RUNNER_IMAGE: ${RUNNER_IMAGE:-}
      # Optional per-session CPU limit in docker NanoCPUs (e.g. 1000000000 = 1 CPU)
      SESSION_CPU_QUOTA: ${SESSION_CPU_QUOTA:-}
      # Erlaubt entfernte Pairing-Code-Erzeugung (POST /api/pairing/create)
      PAIRING_ADMIN_TOKEN: ${PAIRING_ADMIN_TOKEN:-}
      # Optional: FCM service account JSON (single line) for push notifications
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      # ---- Härtung Stufe 2 (Socket-Proxy), siehe RUNBOOK-PI ---------------
      # Statt des rohen Socket-Mounts unten den Proxy ansprechen. Der Proxy
      # redet mit DEMSELBEN lokalen Daemon — einen echten Fremd-Daemon
      # (Fly-/Gateway-Modus aus v1) gibt es in v2 nicht mehr, deshalb braucht
      # es auch kein DOCKER_HOST_IS_LOCAL mehr.
      # DOCKER_HOST: http://socket-proxy:2375
    volumes:
      - orchestrator-data:/data
      # Härtung: diesen Mount entfernen und stattdessen DOCKER_HOST=http://socket-proxy:2375
      # setzen; Start mit --profile socketproxy (dann zusätzlich den
      # networks-Block unten aktivieren).
      - /var/run/docker.sock:/var/run/docker.sock
    # networks:
    #   - default
    #   - socketproxy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---- Docker-Socket-Proxy (Härtung Stufe 2, optional) ----------------
  # Start:  docker compose --profile socketproxy up -d
  # Reduziert die dem Orchestrator sichtbare Docker-API-Oberfläche; der rohe
  # Socket liegt dann nur noch im Proxy (read-only gemountet). Freigeschaltet
  # ist genau das, was server/src/docker.ts braucht: Container create/start/
  # stop/remove/inspect/wait, Netzwerke inkl. connect/disconnect, Volumes,
  # Image-Pull/-Inspect sowie BUILD=1 für POST /build, das der Selbstbau des
  # Runner-Images braucht. Kein EXEC, kein SWARM, kein SYSTEM.
  socket-proxy:
    profiles: ["socketproxy"]
    image: tecnativa/docker-socket-proxy:latest
    container_name: pocketagent-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      NETWORKS: "1"
      VOLUMES: "1"
      POST: "1"
      EXEC: "0"
      # Selbstbau des Runner-Images (POST /build)
      BUILD: "1"
      SWARM: "0"
      SYSTEM: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Bewusst kein ports-Mapping: nur über das interne Netz erreichbar.
    networks:
      - socketproxy

  # ---- Runner-Image vorbauen (optional, build-only, läuft nie) ---------
  # Nur eine Abkürzung: baut dasselbe Image unter demselben Namen, den
  # ensureRunnerImage erwartet, damit der erste Session-Start nicht minutenlang
  # auf den Bau wartet.
  #   docker compose --profile runner build pi-runner
  pi-runner:
    profiles: ["runner"]
    build: { context: ., dockerfile: runner/Dockerfile }
    image: ${RUNNER_IMAGE_PREFIX:-pocketagent}/pi-runner:${RUNNER_IMAGE_TAG:-latest}
    entrypoint: ["true"]

  # ---- Fly-Link-Image vorbauen (optional, build-only, läuft nie) ---------
  # Image für disk-lose Fly-Machines (Fly-Sessions): Link-Agent + eingebetteter
  # pi-Runner, klont beim Start frisch (link/src/fly-bootstrap.ts) und meldet
  # sich per outbound WSS beim Orchestrator. Kein Docker-Socket, kein Volume —
  # der Orchestrator pusht dieses Image in eine Registry (fly deploy).
  #   docker compose --profile fly-runner build fly-runner
  fly-runner:
    profiles: ["fly-runner"]
    build: { context: ., dockerfile: runner/Dockerfile.fly }
    image: ${RUNNER_IMAGE_PREFIX:-pocketagent}/fly-link:${RUNNER_IMAGE_TAG:-latest}
    entrypoint: ["true"]

volumes:
  orchestrator-data:

networks:
  # Internes Netz nur für orchestrator <-> socket-proxy (kein Egress).
  socketproxy:
    internal: true
